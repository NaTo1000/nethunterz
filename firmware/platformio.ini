[platformio]
default_envs = esp32

[env]
framework = espidf
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.0

[env:esp32]
platform = espressif32
board = esp32dev
build_flags =
    -DCONFIG_TARGET_ESP32
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_FREERTOS_HZ=1000

[env:esp32s2]
platform = espressif32
board = esp32-s2-saola-1
build_flags =
    -DCONFIG_TARGET_ESP32S2
    -DCONFIG_FREERTOS_HZ=1000

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    -DCONFIG_TARGET_ESP32S3
    -DBOARD_HAS_PSRAM
    -DCONFIG_FREERTOS_HZ=1000

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    -DCONFIG_TARGET_ESP32C3
    -DCONFIG_FREERTOS_HZ=1000

[env:test]
platform = espressif32
board = esp32dev
build_flags =
    -DUNIT_TEST
    -DCONFIG_TARGET_ESP32
