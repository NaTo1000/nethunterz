# wlan.conf - NetHunterZ WLAN configuration
#
# This file is used by NetHunter tools to configure wireless interfaces.
# Edit the values below to match your target/lab environment.
#
# Copy this file to the device at:
#   /data/local/nhsystem/nh_files/configs/wlan.conf

# -----------------------------------------------------------------------
# Monitor-mode interface configuration
# -----------------------------------------------------------------------

# The wireless interface to use for monitor mode / injection
# Common values: wlan0, wlan1, wlan2
WLAN_IFACE=wlan0

# Monitor-mode interface name (created by airmon-ng / iw)
MON_IFACE=wlan0mon

# Default channel for monitor mode (0 = hop)
MON_CHANNEL=0

# Channel hopping interval in milliseconds
HOP_INTERVAL=200

# -----------------------------------------------------------------------
# Access point configuration (for Evil-AP / hostapd)
# -----------------------------------------------------------------------

# SSID for the rogue/honeypot access point
AP_SSID=NetHunterAP

# WPA2 passphrase (leave blank for open network)
AP_PASSPHRASE=

# AP channel
AP_CHANNEL=6

# AP interface (usually a second wireless card)
AP_IFACE=wlan1

# DHCP range for clients connecting to the AP
AP_DHCP_START=192.168.87.100
AP_DHCP_END=192.168.87.200
AP_SUBNET=192.168.87.0
AP_GATEWAY=192.168.87.1
AP_NETMASK=255.255.255.0

# -----------------------------------------------------------------------
# GPS integration
# -----------------------------------------------------------------------

# Set to 1 to attach GPS location data to captured packets (kismet, etc.)
GPS_ENABLED=0
GPS_HOST=127.0.0.1
GPS_PORT=2947
