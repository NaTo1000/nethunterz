# iFINITEAi2025JESSICAi — CHAiMERA Orchestration Configuration
# 3×3×3 Stack Overlay + ConductorX Clustered Super Orchestration

chimera:
  description: "CHAiMERA chained workflow engine with 3×3×3 stack overlay"

  # ──────────────────────────────────────
  # 3×3×3 Stack Overlay Architecture
  # Depth=3 (layers) × Width=3 (parallel lanes) × Height=3 (pipeline stages)
  # ──────────────────────────────────────
  stack_overlay:
    depth: 3          # Execution layers: recon → exploit → post-exploit
    width: 3          # Parallel processing lanes per layer
    height: 3         # Pipeline stages within each lane (input → process → output)

    layers:
      - name: reconnaissance
        description: "Information gathering and target enumeration"
        lanes:
          - passive_recon     # OSINT, DNS, certificate transparency
          - active_recon      # Port scans, service enumeration
          - wireless_recon    # WiFi scanning, probe capture

      - name: exploitation
        description: "Vulnerability analysis and exploitation"
        lanes:
          - web_exploitation  # SQLi, XSS, file inclusion
          - network_exploit   # SMB, RDP, SSH exploits
          - wireless_exploit  # WPA crack, evil twin, deauth

      - name: post_exploitation
        description: "Persistence, pivoting, data exfiltration"
        lanes:
          - privilege_escalation
          - lateral_movement
          - data_exfiltration

    stages:
      - name: input
        description: "Receive targets and configuration from ConductorX"
      - name: process
        description: "Execute tools and analyze results"
      - name: output
        description: "Report findings and feed next layer"

  # ──────────────────────────────────────
  # Workflow chain configuration
  # ──────────────────────────────────────
  workflow:
    mode: autonomous            # autonomous | manual | hybrid
    parallel_series_switching: true
    hot_swap_enabled: true
    max_concurrent_chains: 27   # 3×3×3

    chain_types:
      - sequential              # A → B → C
      - parallel                # A ∥ B ∥ C
      - conditional             # IF result THEN A ELSE B
      - loop                    # WHILE condition DO A
      - fan_out_fan_in          # Split → [parallel tasks] → Merge

conductorx:
  description: "ConductorX clustered super orchestrator"

  cluster:
    replicas: 3
    consensus: raft
    heartbeat_interval_ms: 500
    election_timeout_ms: 3000

  api:
    host: "0.0.0.0"
    port: 9000
    protocol: http

  scheduling:
    strategy: adaptive          # adaptive | round_robin | priority | least_loaded
    preemption: true
    max_workers: 100

  orchestrators:
    description: "Scalable orchestrator pool managed by ConductorX"
    min_replicas: 3
    max_replicas: 50
    autoscale:
      metric: queue_depth
      target: 10
      cooldown_seconds: 60

  transformers:
    description: "AI-powered transformer bots for intelligent task routing"
    enabled: true
    model_source: huggingface
    capabilities:
      - task_classification
      - result_analysis
      - threat_scoring
      - adaptive_planning

monitoring:
  description: "Autonomous monitoring of all entry points"

  targets:
    ports:
      scan_interval_seconds: 30
      watch_all: true
    localhost:
      monitor: true
      scan_interval_seconds: 10
    usb:
      monitor_all: true
      types: ["USB-A", "USB-C"]
      detect_new_devices: true
      auto_fingerprint: true
    wifi:
      monitor_all_interfaces: true
      monitor_mode_auto: true
      channel_hopping: true
    drivers:
      watch_loaded_modules: true
      alert_on_new: true
    network_interfaces:
      watch_all: true
      alert_on_change: true

ai_integration:
  huggingface:
    enabled: true
    allow_uncensored: true
    model_cache: /opt/jessica/data/hf_cache
    default_models:
      text_generation: "meta-llama/Llama-3.1-70B-Instruct"
      classification: "facebook/bart-large-mnli"
      embedding: "sentence-transformers/all-MiniLM-L6-v2"
    placement_control: true   # Full control over model placement in workflow
    parallel_inference: true
    series_inference: true
