name: Security Scan

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [ 'java', 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Set up JDK 17
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: matrix.language == 'java'
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        if: matrix.language == 'java'
        run: chmod +x gradlew

      - name: Build for CodeQL (Java)
        if: matrix.language == 'java'
        run: ./gradlew compileDebugJavaWithJavac --no-daemon 2>/dev/null || true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python security tools
        run: |
          pip install safety bandit semgrep

      - name: Run Bandit (Python security linter)
        run: |
          bandit -r ai/ cloud/ firmware/ -f json -o bandit-report.json || true
          bandit -r ai/ cloud/ firmware/ -f txt || true
        continue-on-error: true

      - name: Run Safety (Python dependency check)
        run: |
          pip freeze | safety check --stdin || true
        continue-on-error: true

      - name: OWASP Dependency Check (Android)
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        with:
          project: 'nethunterz'
          path: '.'
          format: 'HTML'
          args: >
            --enableRetired
            --suppression .github/dependency-check-suppressions.xml
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 30

  firmware-signature-verify:
    name: Firmware Signature Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cryptography dependencies
        run: pip install cryptography requests

      - name: Import GPG public key
        env:
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
        run: |
          if [ -n "$GPG_PUBLIC_KEY" ]; then
            echo "$GPG_PUBLIC_KEY" | gpg --import
          else
            echo "No GPG public key configured, skipping import"
          fi

      - name: Verify firmware signatures
        run: |
          if ls firmware/signed/*.sig 2>/dev/null; then
            bash security/signing/verify_firmware.sh firmware/signed/
          else
            echo "No signed firmware found to verify"
          fi
        continue-on-error: true

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
