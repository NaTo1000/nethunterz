name: Android App Build

on:
  push:
    branches: ["main", "copilot/**", "feature/**"]
    paths:
      - "android_app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android_app/**"

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Build and test Android app
  # --------------------------------------------------------------------------
  build:
    name: Android Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x android_app/gradlew
        continue-on-error: true

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Build debug APK
        working-directory: android_app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        working-directory: android_app
        run: ./gradlew test --no-daemon

      - name: Run lint
        working-directory: android_app
        run: ./gradlew lint --no-daemon
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nethunterz-debug-apk
          path: android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android_app/app/build/reports/lint-results*.html
          retention-days: 7

  # --------------------------------------------------------------------------
  # Release build (triggered only on version tags)
  # --------------------------------------------------------------------------
  release:
    name: Android Release Build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Build release APK
        working-directory: android_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android_app/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
