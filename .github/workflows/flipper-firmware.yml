name: Flipper Firmware Build

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'firmware/**'
      - '.github/workflows/flipper-firmware.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'firmware/**'
  workflow_dispatch:
    inputs:
      firmware_version:
        description: 'Firmware version to build (e.g., 1.2.3)'
        required: false
        default: 'auto'
      target_device:
        description: 'Target device type'
        required: false
        default: 'flipper_zero'

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      firmware_version: ${{ steps.version.outputs.version }}
      firmware_sha256: ${{ steps.checksum.outputs.sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ufbt scons requests boto3 google-cloud-storage cryptography

      - name: Install ufbt toolchain
        run: |
          python -m ufbt update
          echo "$HOME/.ufbt/toolchain/bin" >> $GITHUB_PATH

      - name: Determine firmware version
        id: version
        run: |
          if [ "${{ github.event.inputs.firmware_version }}" != "auto" ] && [ -n "${{ github.event.inputs.firmware_version }}" ]; then
            VERSION="${{ github.event.inputs.firmware_version }}"
          else
            VERSION="$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Firmware version: $VERSION"

      - name: Build firmware
        run: |
          python firmware/builder/build_firmware.py \
            --version "${{ steps.version.outputs.firmware_version }}" \
            --target "${{ github.event.inputs.target_device || 'flipper_zero' }}" \
            --config firmware/builder/firmware_config.json \
            --output firmware/build/output

      - name: Validate firmware
        run: |
          python firmware/validator/validate_firmware.py \
            --firmware-dir firmware/build/output \
            --version "${{ steps.version.outputs.firmware_version }}"

      - name: Compute firmware checksum
        id: checksum
        run: |
          SHA256=$(sha256sum firmware/build/output/*.bin 2>/dev/null | awk '{print $1}' | head -1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          sha256sum firmware/build/output/* > firmware/build/output/checksums.txt
          echo "SHA256: $SHA256"

      - name: Import GPG key
        if: github.ref == 'refs/heads/main' && secrets.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG key imported"

      - name: Sign firmware
        if: github.ref == 'refs/heads/main'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          bash security/signing/sign_firmware.sh \
            firmware/build/output \
            "$GPG_PASSPHRASE"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flipper-firmware-${{ steps.version.outputs.firmware_version }}
          path: |
            firmware/build/output/
          retention-days: 30

  validate-firmware:
    runs-on: ubuntu-latest
    needs: build-firmware
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cryptography requests

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: flipper-firmware-${{ needs.build-firmware.outputs.firmware_version }}
          path: firmware/build/output

      - name: Verify firmware signatures
        run: |
          python firmware/validator/validate_firmware.py \
            --firmware-dir firmware/build/output \
            --verify-signatures \
            --version "${{ needs.build-firmware.outputs.firmware_version }}"

      - name: Verify checksums
        run: |
          cd firmware/build/output && sha256sum -c checksums.txt

  deploy-firmware:
    runs-on: ubuntu-latest
    needs: [ build-firmware, validate-firmware ]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cloud dependencies
        run: pip install boto3 google-cloud-storage requests

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: flipper-firmware-${{ needs.build-firmware.outputs.firmware_version }}
          path: firmware/build/output

      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          S3_BUCKET: ${{ secrets.S3_FIRMWARE_BUCKET }}
        run: |
          python cloud/storage/s3_uploader.py \
            --bucket "$S3_BUCKET" \
            --firmware-dir firmware/build/output \
            --version "${{ needs.build-firmware.outputs.firmware_version }}"

      - name: Notify cloud dashboard
        env:
          DASHBOARD_API_URL: ${{ secrets.DASHBOARD_API_URL }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
        run: |
          python firmware/updater/autonomous_updater.py \
            --notify-dashboard \
            --version "${{ needs.build-firmware.outputs.firmware_version }}" \
            --sha256 "${{ needs.build-firmware.outputs.firmware_sha256 }}"
