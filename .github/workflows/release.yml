name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        run: ./gradlew :nethunter-app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mv nethunter-app/build/outputs/apk/release/nethunter-app-release*.apk \
             nethunter-app/build/outputs/apk/release/nethunter-${{ steps.version.outputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NetHunter ${{ github.ref_name }}
          body: |
            ## NetHunter ${{ github.ref_name }}

            ### Changes
            See [CHANGELOG](CHANGELOG.md) for details.

            ### Installation
            Download `nethunter-*.apk` and install via `adb install nethunter-*.apk`.

            **Requires a rooted Android device with the Kali NetHunter chroot installed.**
          files: nethunter-app/build/outputs/apk/release/nethunter-${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
