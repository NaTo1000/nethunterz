name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Run linter
        run: |
          flake8 ai_engine/ pineapple_pager/ voice_control/ conversational_ai/ \
            cloud/ flipper/ blckjack_arch/ tests/ \
            --max-line-length=100 --extend-ignore=E203,W503
