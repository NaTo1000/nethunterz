name: NRF Module CI
on:
  push:
    branches: ["main", "copilot/**", "feature/**"]
    paths:
      - "nrf_module/**"
      - "tests/test_nrf_module.py"
  pull_request:
    branches: ["main"]
    paths:
      - "nrf_module/**"
      - "tests/test_nrf_module.py"
permissions:
  contents: read
jobs:
  nrf-tests:
    name: NRF Module Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov
      - name: Run NRF module tests
        run: pytest tests/test_nrf_module.py -v --tb=short --cov=nrf_module
