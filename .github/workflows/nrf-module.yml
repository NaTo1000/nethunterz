name: NRF Module CI

on:
  push:
    branches: ["main", "copilot/**", "feature/**"]
    paths:
      - "nrf_module/**"
      - "cloud/**"
      - "flipper/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/nrf-module.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "nrf_module/**"
      - "cloud/**"
      - "flipper/**"
      - "tests/**"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  # --------------------------------------------------------------------------
  # Lint
  # --------------------------------------------------------------------------
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install flake8 flake8-bugbear

      - name: Flake8
        run: |
          flake8 nrf_module/ cloud/ flipper/ tests/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503

  # --------------------------------------------------------------------------
  # Unit tests
  # --------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest tests/ \
            --cov=nrf_module \
            --cov=cloud \
            --cov=flipper \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # --------------------------------------------------------------------------
  # Runtime smoke test
  # --------------------------------------------------------------------------
  runtime-smoke:
    name: Runtime Smoke Test
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run runtime for 5 seconds (simulation)
        run: |
          timeout 5 python -m nrf_module.runtime --simulation --log-dir /tmp/smoke_logs || true
          echo "Smoke test completed (exit code $?)"

      - name: Verify logs created
        run: |
          ls -la /tmp/smoke_logs/ || echo "(no logs - ok in quick smoke)"
