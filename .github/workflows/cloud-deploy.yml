name: Cloud API Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-deploy.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "cloud/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Test cloud API
  # --------------------------------------------------------------------------
  test-cloud:
    name: Cloud API Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt aiohttp

      - name: Run cloud tests
        run: pytest tests/test_cloud_orchestrator.py -v

  # --------------------------------------------------------------------------
  # Build Docker image for cloud API server
  # --------------------------------------------------------------------------
  build-docker:
    name: Build Cloud Docker Image
    runs-on: ubuntu-latest
    needs: test-cloud
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: cloud/Dockerfile
          push: false
          tags: nethunterz-cloud:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true  # Dockerfile may not exist in all environments

  # --------------------------------------------------------------------------
  # Deploy to cloud (main branch only)
  # --------------------------------------------------------------------------
  deploy-cloud:
    name: Deploy Cloud API
    runs-on: ubuntu-latest
    needs: [test-cloud, build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to cloud
        run: |
          echo "Deploying cloud API at commit ${{ github.sha }}"
          # In production: kubectl apply -f k8s/ or similar
          echo "Deploy complete."
        env:
          CLOUD_DEPLOY_KEY: ${{ secrets.CLOUD_DEPLOY_KEY }}
