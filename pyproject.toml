[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grok420"
version = "420.0.0"
description = "Grok 420 — NayDoev1 Conductor, CHAiMERA Orchestration, TWINBRAIN & Blockchain Memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41.0",
    "pydantic>=2.5",
    "aiohttp>=3.9",
    "httpx>=0.26",
    "tenacity>=8.2",
    "structlog>=24.1",
    "prometheus-client>=0.19",
    "tinydb>=4.8",
    "anyio>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["grok420*"]
