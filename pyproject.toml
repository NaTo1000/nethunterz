[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nethunterz"
version = "4.2.0"
description = "NetHunterz Full-Stack: Pineapple Pager, Grok 420, NayDoeV1, JessicAi Medusa Cyberstack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncio",
    "aiohttp>=3.9",
    "cryptography>=42.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.26",
    "websockets>=12.0",
    "aiomqtt>=1.2",
    "loguru>=0.7",
    "rich>=13.7",
    "typer>=0.9",
    "numpy>=1.26",
    "hashlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
