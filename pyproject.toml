[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jessica-huntress"
version = "2025.1.0"
description = "iFINITEAi2025JESSICAi — Huntress Edition: Autonomous security platform with CHAiMERA orchestration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "NaTo1000" },
]
keywords = ["security", "pentesting", "orchestration", "ai", "nethunter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "psutil>=5.9",
    "netifaces2>=0.0.22",
]

[project.optional-dependencies]
ai = [
    "huggingface-hub>=0.23",
    "transformers>=4.48",
    "torch>=2.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
jessica = "jessica.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["jessica*"]
